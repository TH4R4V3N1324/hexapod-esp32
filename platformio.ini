; hexapod-esp32: gait_core on an ESP32, driving 18 ST3215 bus servos
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DEIGEN_NO_DEBUG
    ; gait_core's headers include Eigen, so the firmware's sources need it too, not just the library
    -Iexternal/hexapod-gait-core/third_party/eigen

; The submodule, pinned to a release tag (see README)
lib_deps =
    gait_core=symlink://external/hexapod-gait-core
